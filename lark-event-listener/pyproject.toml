[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-event-listener"
version = "0.1.0"
description = "Long-connection listener for Lark/Feishu IM events → spawn hermes-z (ottagent inbound channel)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "ottagent contributors" },
]
dependencies = [
    "lark-oapi>=1.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
lark-event-listener = "lark_event_listener.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
