[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaozhi-mcp-adapter"
version = "0.1.0"
description = "Spike MCP adapter for xiaozhi endpoint echo round-trip"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mcp",
    "websockets>=12",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
